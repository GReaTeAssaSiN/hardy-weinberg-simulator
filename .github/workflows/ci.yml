name: Проверки проекта

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python — тесты модели и API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Установить зависимости
        run: python -m pip install -r requirements.txt
      - name: Выполнить тесты
        run: python -m pytest -q

  frontend:
    name: Интерфейс — тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Получить код
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Установить зависимости
        run: npm ci
      - name: Выполнить тесты
        run: npm run test
      - name: Собрать интерфейс
        run: npm run build
